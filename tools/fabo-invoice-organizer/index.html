<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="完全离线、跨系统使用的 A5 发票 PDF 整理和打印工具">
<title>离线发票整理器｜A5 打印</title><style>:root{--ink:#201d1a;--muted:#766f68;--paper:#f6f2ea;--panel:#fffdfa;--line:#d9d1c5;--red:#9f2f2b;--red-dark:#78231f;--green:#276c53;}*{box-sizing:border-box;}html{background:var(--paper);color:var(--ink);}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}button,input{font:inherit;}button{cursor:pointer;}button:disabled{cursor:not-allowed;opacity:.45;}.app-shell{min-height:100vh;padding:30px clamp(20px,4vw,64px) 64px;background:radial-gradient(circle at 85% 0%,#eadfd1 0,transparent 28%),var(--paper);}.masthead{max-width:1440px;margin:0 auto 26px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--line);}.brand-mark{width:58px;height:58px;display:grid;place-items:center;border:2px solid var(--red);border-radius:50%;color:var(--red);font:800 21px/1 Georgia,serif;box-shadow:inset 0 0 0 5px var(--paper),inset 0 0 0 6px var(--red);}.eyebrow{margin:0 0 4px;color:var(--red);font-size:11px;font-weight:800;letter-spacing:.16em;}h1{margin:0;font:700 clamp(27px,3.5vw,42px)/1.12 Georgia,"Songti SC",serif;}.lede{margin:7px 0 0;color:var(--muted);font-size:14px;}.privacy-chip{align-self:start;display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid #b7cabc;border-radius:999px;color:var(--green);background:#f5faf6;font-size:12px;font-weight:700;}.privacy-chip span{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #dcebe2;}.workspace-grid{max-width:1440px;margin:auto;display:grid;grid-template-columns:310px minmax(0,1fr);gap:24px;align-items:start;}.control-panel,.preview-panel{border:1px solid var(--line);background:rgba(255,253,250,.88);box-shadow:0 14px 42px rgba(60,45,32,.07);}.control-panel{position:sticky;top:20px;padding:22px;}.step-label{display:flex;gap:10px;align-items:center;margin:3px 0 13px;font-size:12px;font-weight:800;letter-spacing:.08em;}.step-label:not(:first-child){margin-top:26px;}.step-label span{color:var(--red);font-family:Georgia,serif;}.drop-zone{min-height:180px;padding:22px 18px;border:1.5px dashed #baa992;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#fbf7f0;outline:none;transition:.2s ease;}.drop-zone:hover,.drop-zone:focus-visible{border-color:var(--red);background:#fff9f1;transform:translateY(-1px);}.folder-icon{width:45px;height:36px;margin-bottom:10px;display:grid;place-items:center;border:1px solid #bfa98c;color:var(--red);font-size:25px;}.drop-zone strong{font-size:16px;}.drop-zone span{max-width:220px;margin:6px 0 14px;color:var(--muted);font-size:12px;line-height:1.55;}.drop-zone button{padding:8px 16px;border:0;background:var(--red);color:white;font-size:12px;font-weight:700;}.pdf-picker-action{width:100%;margin-top:9px;padding:10px;border:1px solid var(--red);background:#fff9f7;color:var(--red);font-weight:800;}.pdf-picker-action:hover:not(:disabled){background:#fff0ec;}.preview-add-action{margin-top:18px;padding:14px;border-style:dashed;background:#fff;}.field-label{display:block;margin-bottom:7px;color:var(--muted);font-size:11px;}.text-field{width:100%;padding:10px 11px;border:1px solid var(--line);background:#fff;outline:none;}.text-field:focus{border-color:var(--red);box-shadow:0 0 0 3px #9f2f2b15;}.setting-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #ebe5dc;font-size:12px;}.setting-row span{color:var(--muted);}.secondary-action{width:100%;margin-top:9px;padding:9px;border:1px solid var(--line);background:white;font-size:12px;font-weight:700;}.danger-action{color:#9e382f;border-color:#d9aaa4;background:#fff8f6;}.danger-action:hover:not(:disabled){color:#7d211b;border-color:#9e382f;background:#fff1ee;}.status-card{display:grid;grid-template-columns:1fr 1fr;margin-top:20px;border:1px solid var(--line);background:#f8f3eb;}.status-card div{padding:13px;display:flex;align-items:baseline;gap:5px;}.status-card div + div{border-left:1px solid var(--line);}.status-card strong{color:var(--red);font:700 24px Georgia,serif;}.status-card span{color:var(--muted);font-size:10px;}.progress-text{min-height:34px;margin:9px 1px;color:var(--muted);font-size:11px;line-height:1.5;overflow-wrap:anywhere;}.action-stack{display:grid;gap:8px;}.primary-action,.print-a4-action,.download-action{padding:12px;border:0;font-weight:800;}.primary-action{background:var(--red);color:white;}.primary-action:hover{background:var(--red-dark);}.print-a4-action{background:var(--ink);color:white;}.print-a4-action:hover:not(:disabled){background:#31312f;}.download-action{border:1px solid var(--ink);background:transparent;color:var(--ink);}.preview-panel{min-height:700px;padding:clamp(20px,3vw,34px);}.preview-heading{display:flex;justify-content:space-between;gap:20px;align-items:end;padding-bottom:18px;border-bottom:1px solid var(--line);}.preview-heading h2{margin:0;font:700 26px Georgia,"Songti SC",serif;}.preview-heading > p{max-width:390px;margin:0;color:var(--muted);font-size:12px;line-height:1.6;text-align:right;}.empty-state{min-height:580px;display:grid;place-items:center;align-content:center;text-align:center;}.empty-paper{width:176px;aspect-ratio:1.414;display:grid;place-items:center;border:1px solid #bcb3a6;background:white;box-shadow:12px 12px 0 #ede6dc;transform:rotate(-2deg);}.empty-paper span{color:#c3b9ab;font:700 28px Georgia,serif;letter-spacing:.12em;}.empty-state h3{margin:35px 0 7px;font:700 21px Georgia,"Songti SC",serif;}.empty-state p{max-width:430px;margin:0;color:var(--muted);font-size:13px;line-height:1.65;}.empty-state ol{display:flex;gap:26px;margin:25px 0 0;padding:0;list-style-position:inside;color:var(--red);font-size:11px;font-weight:700;}.page-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding-top:22px;}.page-card{min-width:0;border:1px solid var(--line);background:#fff;}.page-meta{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #e8e1d7;}.page-meta span{color:var(--red);font:700 13px Georgia,serif;}.page-meta p{min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11px;}.paper-preview{aspect-ratio:1.414;padding:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#e9e4dc;}.paper-preview img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 2px 8px #0002;}.page-tools{display:flex;flex-wrap:wrap;gap:5px;padding:9px;border-top:1px solid #e8e1d7;}.page-tools button{padding:6px 8px;border:1px solid #ddd4c7;background:#faf7f2;font-size:10px;}.page-tools button:hover:not(:disabled){border-color:var(--red);color:var(--red);}.page-tools .danger{margin-left:auto;color:#a12828;}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}.print-document{display:none;}@media (max-width:900px){.app-shell{padding:20px 14px 45px;}.masthead{grid-template-columns:auto 1fr;}.privacy-chip{grid-column:1 / -1;justify-self:start;}.workspace-grid{grid-template-columns:1fr;}.control-panel{position:static;}.preview-heading{align-items:start;flex-direction:column;}.preview-heading > p{text-align:left;}}@page{size:A5 landscape;margin:0;}@media print{html,body{background:white;}.app-shell{display:none !important;}.print-document{display:block;}.print-sheet{width:210mm;height:148mm;padding:5mm;display:flex;align-items:center;justify-content:center;overflow:hidden;break-after:page;page-break-after:always;}.print-sheet:last-child{break-after:auto;page-break-after:auto;}.print-sheet img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}}</style></head>
